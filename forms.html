<!DOCTYPE html>
<html >
<head>

   
    <title>Shopping-Times Login</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: rgb(133, 33, 49); /* Light pink background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: #fff0f5; /* lighter pink */
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
        }

        h1 {
            margin-bottom: 10px;
            color: #800000; /* dark red */
        }

        h3 {
            margin-bottom: 30px;
            font-weight: normal;
            color: #333;
        }

        input[type="text"], input[type="password"] {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: #800000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #a00000;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }
         body {
  background: linear-gradient(to right, rgb(138, 25, 57),rgb(165, 79, 79), rgb(158, 13, 54));
}
    </style>
</head>
<body>
    

    <div class="login-container">
        <h1>Welcome to ShopNOW</h1>
        <h3>Welcome to World of Fashion</h3>

        <form action="#" method="post">
            <input type="text" name="username" placeholder="Username" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Login</button>
        </form>

        <div class="footer">
            &copy; Designed & Developed by Sakshi Pawar
        </div>
    </div>
</body>
</html>
