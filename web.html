<!DOCTYPE html>
<html lang="en">

<head>
 
  <title>ShopNOW</title>
  <link rel="stylesheet" href="web.css">
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      color: #333;
    }

    /* Header */
    header {
      
  background: linear-gradient(to right, rgb(13, 99, 13),white,orange);
  
      color: #fff;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 24px;
    }

    .header-buttons button {
      margin-left: 10px;
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      background: crimson;
      color: white;
      transition: 0.3s;
    }

    .header-buttons button:hover {
      background: darkred;
    }

    /* Products Grid */
    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 4 per row */
      gap: 20px;
      padding: 30px;
      max-width: 1300px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      padding: 15px;
      transition: transform 0.3s;
      text-align: center;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }

    .card p {
      margin-top: 10px;
      font-weight: bold;
    }

    /* Footer */
    footer {
      background: linear-gradient(to right, rgb(13, 99, 13),white,orange);

      color:black;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
      width: 100%;
    }

    
    body {
  background: linear-gradient(to right,  orange,white, rgb(27, 138, 27));
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <h1>ShopNOW</h1>
    <div class="header-buttons">
      <button onclick="location.href='register.html'">Register</button>
      <button onclick="location.href='forms.html'">Login</button>
      <button onclick="location.href='about.html'">about us</button>
     
    </div>
  </header>

  <!-- Products -->
  <div class="products">
    <div class="card"><img src="img1.jpeg" alt="air fryer"><p>AIR FRYER</p></div>
    <div class="card"><img src="img3.jpeg" alt="deep fryer"><p>DEEP FRYER</p></div>
    <div class="card"><img src="img5.jpeg" alt="oven"><p>OVEN</p></div>
    <div class="card"><img src="img6.jpeg" alt="laptop"><p>LAPTOP</p></div>
    <div class="card"><img src="img7.jpeg" alt="headphone"><p>HEADPHONE</p></div>
    <div class="card"><img src="img8.jpeg" alt="earphone"><p>EARPHONE</p></div>
    <div class="card"><img src="img9.jpeg" alt="earpod"><p>EARPOD</p></div>
    <div class="card"><img src="img10.jpeg" alt="printer"><p>PRINTER</p></div>
    <div class="card"><img src="img11.jpeg" alt="speaker"><p>SPEAKER</p></div>
    <div class="card"><img src="img15jpeg.jpeg" alt="smartphone"><p>SMARTPHONE</p></div>
    <div class="card"><img src="img13.jpeg" alt="smartwatch"><p>SMARTWATCH</p></div>
    <div class="card"><img src="img14.jpeg" alt="AC"><p>AC</p></div>
    <div class="card"><img src="C.jpeg" alt="camera"><p>CAMERA</p></div>
    <div class="card"><img src="img16.jpeg" alt="refrigerator"><p>REFRIGERATOR</p></div>
    <div class="card"><img src="img17.jpeg" alt="microwave"><p>MICROWAVE</p></div>
    <div class="card"><img src="H.jpeg" alt="heater"><p>HEATER</p></div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 SAKSHI PAWAR. All Rights Reserved.</p>
  </footer>

</body>
</html>
